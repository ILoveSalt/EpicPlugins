settings:
  prefix: '&6&lＥＰＩＣ+'
  default-duration: '30d'
  warning-before: '3d'
  check-interval-seconds: 60
  permission-add-commands:
  - 'lp user %player% permission set %permission% true'
  permission-remove-commands:
  - 'lp user %player% permission unset %permission%'

subscription:
  permissions:
  - kit.sub
  - epiccoins.coins.pay
  plus-prefix: '&6&l+'
  fallback-tab-name: ''
  tab:
    enabled: true
    tablist: true
    nametag: true
  luckperms:
    enabled: true
    prefix-priority: 10000

messages:
  no_sub: '&cУ вас нет подписки.'
  sub_time: '&aВаша подписка активна еще &e%time%&a.'
