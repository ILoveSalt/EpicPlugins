# EpicCooldown — кулдауны на команды по группам
#
# Права:
#   epiccooldown.bypass - игрок с этим правом игнорирует все кулдауны
#   epiccooldown.admin  - доступ к команде /epiccooldowns (reload, save, clear, clearall)
#
# Определение группы:
#   Если установлен VaultUnlocked (или Vault) — берётся основная группа игрока
#   через его API. Если его нет — группа определяется по праву group.<имя группы>.

# Автосохранение кулдаунов каждые N минут (0 - отключить)
autosave-minutes: 5

time:
  days: '&6&l%size% &fдень'
  minutes: '&6&l%size% &fминут(ы)'
  seconds: '&6&l%size% &fсекунд(ы)'
  hours: '&6&l%size% &fчас(а)'
  now: '&6&lсейчас'

