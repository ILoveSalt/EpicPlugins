config: example

event_name: 'Example Event'
event_description: 'This is an example event description. It can be as long as you want and can include multiple lines of text to provide detailed information about the event.'
event_time: 15 minutes
event_players: 2 

step_event:
  step_1:
   start:
    - 'Ивент %example_event% появится через 5 минут. Подготовьтесь к нему и не пропустите шанс выиграть крутые призы!'
   time: 5 minutes
  step_2:
   play:
    - 'Ивент %example_event% Появился на координатах x - %x% y - %y% z - %z%!'
    - 'Соберитесь с друзьями и участвуйте в этом захватывающем событии, чтобы выиграть крутые призы!'
    create: chest
    opentime: 3 minutes
    holo: 
    - '&bExample Event'
    - '&7Participate and win prizes!'
    - '&7Нажми чтоб открыть'
    holo_opener:
    - '&aexample event'
    - '&7Осталось времени до открытия: &b%time%'
    holo_opened:
    - '&aexample event'
    - '&7Сундук открыт!'
  step_3:
   end:
    - 'Ивент %example_event% завершился! Поздравляем победителей и благодарим всех участников за участие в этом захватывающем событии!'
   delete: chest

 region: 15x15x15 # развмер региона ивента
 name_region: %x%%y%%z%eventregion # типо 100 100 100 будет 100100100eventregion
 
 loot:
  apple:
   chance: 50
   min: 1
   max: 5
  diamond:
   chance: 30
   min: 1
   max: 3
  gold_ingot:
    chance: 20
    min: 1
    max: 2
  

