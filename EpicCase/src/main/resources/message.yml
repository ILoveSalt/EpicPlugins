      - '&e/ecase points setParameter f<&eпараметр&f> f<&eзначениеа&f>&f- Изменяет указанный параметр. Оставьте значение пустым, чтобы сбросить параметр.'
      - '&e/ecase points copy &f- Копировать данные этой точки открытия.'
      - '&e/ecase points paste &f- Вставить скопированные данные в эту точку открытия.'
