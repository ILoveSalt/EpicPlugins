time: 3600 # 1 час
bosses:
  boss1:
    name: "§c§l⚠ §c§lʙыбиʙᴀтᴇль ᴋᴏᴄтᴇй §f§l➲ §f§l<§6§l{health}§f§l/§6§l{maxHealth}§f§l> §c§l❤ §c§l⚠"
    type: WITHER_SKELETON # тип монстра
    location: pvp;-85;89;-66;0;0 # точка спавна босса
    maxHealth: 1000
    push: # Отталкивания при ударе
      chance: 0
      x: 0
      y: 0
      z: 0
    damage:
      chance: 50
      multiply: 2.53
    spawn: # команды, которые производятся после создания босса
      - "broadcast: §r"
      - "broadcast: §c▄§6▀§e▄§a▀§b▄§9▀§d▄§c▀§6▄§e▀§a▄§b▀§9▄§dဍ§c▄§6▀§e▄§a▀§b▄§9▀§dᄍ"
      - "broadcast: §r"
      - "broadcast: §8 §8§l╔ §fʜᴀ §6§lПвП-Арене§f§l, §fпᴏяʙилᴄя §f§l➲ §c§lʙыбиʙᴀтᴇль ᴋᴏᴄтᴇй §c§l⚠"
      - "broadcast: §8 §8§l╚ §fʜᴀйти ᴇгᴏ ᴍᴏжʜᴏ ʜᴀ §6§lпʙп-ᴀᴘᴇʜᴇ§f§l, §fʙыпᴏлʜиʙ ᴋᴏᴍᴀʜду §f§l➲ §6§l/warp pvp"
      - "broadcast: §r"
      - "broadcast: §c §c§l⚠ &f&lигᴘᴏᴋ, ᴋᴏтᴏᴘый убьᴇт ᴇгᴏ, пᴏлучит &6&lȹᴘᴀʜᴋи&f&l, &6&lᴍᴏʜᴇты&f&l, §c§l⚠"
      - "broadcast: &6 &6&lдᴏʜᴀтᴇᴘᴄᴋиᴇ ʙᴇщи §c§l⚠"
      - "broadcast: §r"
      - "broadcast: §c▄§6▀§e▄§a▀§b▄§9▀§dᄍ§c▀§6▄§e▀§a▄§b▀§9▄§dဍ§c▄§6▀§e▄§a▀§b▄§9▀§dᄍ"
      - "broadcast: §r"
    reward: # команды, которые производятся после смерти босса
      - "kit give boss {player}"
      - "eco give {player} 15000"
      - "coins add {player} 200"
    timeout: # команды, которые производятся при удалении босса по таймеру
      - "broadcast: §r"
      - "broadcast: §c▄§6▀§e▄§a▀§b▄§9▀§dᄍ§c▀§6▄§e▀§a▄§b▀§9▄§dဍ§c▄§6▀§e▄§a▀§b▄§9▀§dᄍ"
      - "broadcast: §r"
      - "broadcast: §8 §8§l╔ §c§lʙᴏꜱꜲ §f§l{name} §c§lʙыл ᴜдалᴇн §c§l⚠"
      - "broadcast: §8 §8§l╚ §fʙᴏꜱꜲ ᴘᴏᴋинул §6§lпʙп-ᴀᴘᴇнᴜ §f§l➲ §6§l/WARP PVP"
      - "broadcast: §r"
      - "broadcast: §c▄§6▀§e▄§a▀§b▄§9▀§dᄍ§c▀§6▄§e▀§a▄§b▀§9▄§dဍ§c▄§6▀§e▄§a▀§b▄§9▀§dᄍ"
      - "broadcast: §r"
    spawnMob:
      time: 99999 # 30 секунд
      types:
        - "SKELETON;100;500"
        - "SKELETON;100;500"
        - "HUSK;100;300"
        - "HUSK;100;300"
        - "HUSK;100;300"
        - "GUARDIAN;100;100"
        - "STRAY;100;250"
    lifeTime: 3600 # Время жизни босса в секундах. Если босса не убьют за это время - он будет удалён (0 = отключить удаление по таймеру)
    items:
      - ""
    stages:
      '70':
        speed: 0.9
        damage: 13.0
      '30':
        speed: 0.6
        damage: 11.0
    effects:
      - 'JUMP;30-60'
      - 'FREEZE;60-120'
