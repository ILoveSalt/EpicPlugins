    help: |-
      §r §r
      §c▄§6▀§e▄§a▀§b▄§9▀§dᄍ§c▀§6▄§e▀§a▄§b▀§9▄§dဍ§c▄§6▀§e▄§a▀§b▄§9▀§dᄍ
      §r §r
      §6§l▌ §fПерезагрузить конфигурацию плагина §f§l➲ §6§l/boss reload
      §6§l▌ §fЗаспавнить босса §f§l➲ §6§l/boss spawn §f§l<§6§lназвание босса§f§l>
      §r §r
      §c▄§6▀§e▄§a▀§b▄§9▀§dᄍ§c▀§6▄§e▀§a▄§b▀§9▄§dဍ§c▄§6▀§e▄§a▀§b▄§9▀§dᄍ
      §r §r
    info:
      notSpawned: "Currently boss not spawned!"
      spawned:
        - "Name: {id}/{name}"
        - "Type: {type}"
        - "Health: {health}/{maxHealth}"
