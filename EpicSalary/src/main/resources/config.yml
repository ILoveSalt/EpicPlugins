# ==========================================================
# EpicSalary — автовыдача зарплаты донат-группам.
# Зарплата выдаётся САМА, без команды: раз в checkTime минут плагин проверяет
# всех онлайн-игроков. Для каждого игрока ищется донат-группа по разрешению:
#     epicsalary.salary.<группа>
# где <группа> — ключ секции 'salary' ниже (warrior, prince, knight и т.д.).
# Если игрок имеет право на несколько групп — берётся первая по порядку.
# Выдача происходит только когда кулдаун (cooldown, в секундах) истёк.
# Дата последней выдачи каждого игрока хранится в файле игрецкой папки
# плагина: plugins/EpicSalary/salary.yml
# ==========================================================

# Как часто проверять игроков и выдавать зарплату (в минутах)
checkTime: 5

messages:
  onlyPlayer: "&6&lЗАРПЛАТА: &fКоманда доступна только игрокам."
  noPermission: "&6&lЗАРПЛАТА: &cУ вас нет разрешения на использование данной команды."
  salaryEmpty: "&6&lЗАРПЛАТА: &cУ вас нет зарплаты."

salary:
  warrior:
    cooldown: 2700
    message: "&6&lЗАРПЛАТА: &fВы успешно получили зарплату &f&l➲ &6&l800⛃"
    cooldownMessage: "&6&lЗАРПЛАТА: &fВы сможете получить зарплату через &f&l➲ &6&l{time} &fв размере &6&l800⛃"
    commands:
      - 'eco give {player} 800'
